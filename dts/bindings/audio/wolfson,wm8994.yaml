description: WM8994 audio codec

include: [i2c-device.yaml]

compatible: "wolfson,wm8994"

properties:
  reg:
    required: true
  clock-source:
    type: string
    default: "MCLK"
    description: |
      Codec's internal clock signal (SYSCLK) source selection. These options
      are available:
      - "MCLK": wm8994's MCLK pin (supplied by the host)
      - "FLL":  wm8994's FLL facility, can be free-running
      The "MCLK" option is default, as this clock signal is usually supplied
      by the host.
    enum:
      - "MCLK"
      - "FLL"
